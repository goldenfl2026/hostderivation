<head>

  <style>

    body{font-family:'Outfit',sans-serif;background:var(--bg-primary);color:var(--text-primary);margin:0;padding:32px 18px;min-height:100vh;overflow-x:hidden}
    body:before{content:'';position:fixed;inset:0;opacity:.025;pointer-events:none;z-index:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
    main{position:relative;z-index:1;width:min(100%,760px);margin:30px auto;padding:34px;background:linear-gradient(160deg,#151515 0%,#101010 100%);border:1px solid var(--border-gold);border-radius:16px;box-shadow:0 18px 60px rgba(0,0,0,.62),0 0 38px rgba(var(--gold-rgb),.055)}
    h1{margin:0 0 10px;text-align:center;font-family:'Cinzel',serif;font-size:clamp(22px,4vw,30px);font-weight:700;letter-spacing:2.5px;text-transform:uppercase;background:linear-gradient(135deg,var(--gold-light),var(--gold),var(--gold-dark),var(--gold-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    main>p:first-of-type{text-align:center;max-width:580px;margin:0 auto 28px;color:var(--text-secondary);font-size:14px;line-height:1.65}
    h2{margin:28px 0 14px;padding-bottom:10px;border-bottom:1px solid var(--border-gold);font-family:'Cinzel',serif;font-size:15px;letter-spacing:1.5px;color:var(--gold-light)}
    label{display:block;margin:15px 0 6px;font-family:'Cinzel',serif;font-size:10px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--gold)}
    input{display:block;width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:8px;background:var(--bg-input);color:var(--text-primary);font:400 14px 'Outfit',sans-serif;outline:none;transition:border-color .2s,box-shadow .2s}
    input::placeholder{color:#625c52}input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(var(--gold-rgb),.12)}

    button:hover{transform:translateY(-1px);box-shadow:0 5px 18px rgba(var(--gold-rgb),.2);filter:brightness(1.06)}button:focus-visible{outline:2px solid var(--gold-light);outline-offset:3px}
    button.secondary{background:rgba(255,255,255,.035);border-color:var(--border);color:var(--text-secondary)}button.secondary:hover{border-color:var(--border-gold);color:var(--gold-light);box-shadow:none}
    button.danger{margin-left:0;background:rgba(180,54,54,.12);border-color:rgba(231,76,60,.4);color:#e58b83}button.danger:hover{background:rgba(180,54,54,.2);box-shadow:0 4px 15px rgba(231,76,60,.12)}

<body><main>
  <h1>Administrar números de WhatsApp</h1>
  <p>Esta pantalla es para el equipo. El nombre/aclaración se guarda solo para identificar el número y nunca aparece en el sitio público.</p>
  <section id="login">
    <label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password">
    <button id="loginButton">Ingresar</button>
  </section>
  <section id="editor" class="hidden">
    <div id="numbers"></div>
    <h2>Agregar número</h2>
    <label for="newLabel">Nombre o aclaración (solo para ustedes)</label><input id="newLabel" placeholder="Ej.: Turno tarde">
    <label for="newPhone">Teléfono internacional, solo números</label><input id="newPhone" inputmode="numeric" placeholder="54911...">
    <button id="addButton">Agregar número</button>
    <button id="logoutButton" class="secondary">Cerrar sesión</button>
    <p class="hint">Usá el formato internacional sin +, espacios ni guiones. Ejemplo: 5491136122445.</p>
  </section>
  <div id="status" class="status" role="status" aria-live="polite"></div>
</main>
<script>
  // Reemplazar por la URL del servicio cuando quede publicado.
  const API_URL="https://numerosnuevosdeatencion.goldenfl2026.workers.dev";
  let token=sessionStorage.getItem("golden_admin_token")||"";
  let entries=[];
  const statusBox=document.getElementById("status");
  function status(message){statusBox.textContent=message}
  function showEditor(){document.getElementById("login").classList.add("hidden");document.getElementById("editor").classList.remove("hidden")}
  function phoneOk(phone){return /^\d{8,15}$/.test(phone)}
  async function api(path,options={}){
    const response=await fetch(API_URL+path,{...options,headers:{"Content-Type":"application/json",...(token?{"Authorization":"Bearer "+token}:{}),...(options.headers||{})}});
    const result=await response.json().catch(()=>({}));
    if(!response.ok)throw new Error(result.error||"No se pudo completar la operación");
    return result;
  }
  function render(){
    const root=document.getElementById("numbers");
    root.innerHTML=entries.map((item,index)=>`<div class="row"><label>Nombre o aclaración</label><input data-label="${index}" value="${escapeHtml(item.label)}"><label>Teléfono</label><input data-phone="${index}" inputmode="numeric" value="${escapeHtml(item.phone)}"><div class="row-actions"><button data-save="${index}">Guardar cambios</button><button class="danger" data-delete="${index}">Eliminar</button></div></div>`).join("")||"<p>Todavía no hay números cargados.</p>";
    root.querySelectorAll("[data-save]").forEach(button=>button.onclick=()=>saveEntry(Number(button.dataset.save)));
    root.querySelectorAll("[data-delete]").forEach(button=>button.onclick=()=>deleteEntry(Number(button.dataset.delete)));
  }
  function escapeHtml(value){return String(value).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]))}
  async function load(){try{const data=await api("/admin/numbers");entries=data.entries||[];render();showEditor();status("")}catch(error){sessionStorage.removeItem("golden_admin_token");token="";document.getElementById("login").classList.remove("hidden");document.getElementById("editor").classList.add("hidden");status(error.message)}}
  async function save(){try{await api("/admin/numbers",{method:"PUT",body:JSON.stringify({entries})});status("Cambios guardados.")}catch(error){status(error.message)}}
  async function saveEntry(index){const label=document.querySelector(`[data-label="${index}"]`).value.trim();const phone=document.querySelector(`[data-phone="${index}"]`).value.trim();if(!label){status("Escribí una aclaración para identificar este número.");return}if(!phoneOk(phone)){status("El teléfono debe tener entre 8 y 15 dígitos, sin + ni espacios.");return}entries[index]={label,phone};await save();render()}
  async function deleteEntry(index){if(!confirm(`¿Eliminar “${entries[index].label}”?`))return;entries.splice(index,1);await save();render()}
  document.getElementById("loginButton").onclick=async()=>{try{const result=await api("/admin/login",{method:"POST",body:JSON.stringify({password:document.getElementById("password").value})});token=result.token;sessionStorage.setItem("golden_admin_token",token);await load()}catch(error){status(error.message)}};
  document.getElementById("addButton").onclick=async()=>{const label=document.getElementById("newLabel").value.trim();const phone=document.getElementById("newPhone").value.trim();if(!label){status("Escribí una aclaración para identificar este número.");return}if(!phoneOk(phone)){status("El teléfono debe tener entre 8 y 15 dígitos, sin + ni espacios.");return}entries.push({label,phone});await save();document.getElementById("newLabel").value="";document.getElementById("newPhone").value="";render()};
  document.getElementById("logoutButton").onclick=()=>{sessionStorage.removeItem("golden_admin_token");token="";location.reload()};
  if(API_URL.includes("PEGAR_URL")){status("Falta configurar la URL del servicio. Seguí la guía de instalación.")}else if(token){load()}
</script></body></html>
