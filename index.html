<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Golden S.</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial}
    body{display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:16px;box-sizing:border-box;background:linear-gradient(135deg,#fff8f0,#fff1e6)}
    .card{background:#fff;padding:28px;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.08);max-width:520px;width:100%;text-align:center}
    h1{margin:0 0 8px;font-size:20px}p{margin:0 0 18px;color:#666}
    .btn{display:inline-block;padding:10px 16px;border-radius:10px;text-decoration:none;font-weight:600;border:0;cursor:pointer}
    .btn-primary{background:#d97706;color:#fff}.btn-secondary{background:#f3f4f6;color:#111;margin-left:8px}
    small{display:block;margin-top:12px;color:#999}ul{list-style:none;padding:0;margin:0}
    li{margin:8px 0}li a{padding:10px 12px;border-radius:8px;background:#f8fafc;display:inline-block;text-decoration:none;color:#111}
  </style>
</head>
<body>
  <main class="card" id="card">
    <h1>Golden S.</h1>
    <p>Te estamos conectando con uno de nuestros números de WhatsApp. Si la redirección no funciona, podés elegir manualmente abajo.</p>
    <div id="actions">
      <button class="btn btn-primary" id="openBtn">Ir a WhatsApp (redirección automática)</button>
      <a class="btn btn-secondary" id="chooseBtn" href="#">Elegir número manual</a>
    </div>
    <small>Pagos en el acto!</small>
  </main>
  <script>
    // Se completa con la dirección del servicio siguiendo la guía de instalación.
    const API_URL = "https://numerosnuevosdeatencion.goldenfl2026.workers.dev";
    const mensaje = encodeURIComponent("Hola! Quisiera mas info sobre Golden S. <3");
    const redirectDelay = 1600;
    let numbers = [];
    const card = document.getElementById("card");
    function buildWaLink(number){return "https://wa.me/"+number+"?text="+mensaje}
    function elegirNumeroRandom(){return numbers[Math.floor(Math.random()*numbers.length)]}
    function mostrarFalla(){card.innerHTML='<h1>Golden S.</h1><p>En este momento no pudimos cargar los números. Probá de nuevo en unos segundos.</p>'}
    function openManual(e){
      e.preventDefault();
      const list=numbers.map(n=>`<li><a href="${buildWaLink(n)}" target="_blank" rel="noopener">Abrir WhatsApp ${n.replace(/^54/,"")}</a></li>`).join("");
      card.innerHTML=`<h1>Golden</h1><p>Elegí con cuál número de WhatsApp querés comunicarte:</p><ul>${list}</ul><small>Volverá a redirigir automáticamente si recargás la página.</small>`;
    }
    async function iniciar(){
      if(API_URL.includes("PEGAR_URL")){mostrarFalla();return}
      try{
        const response=await fetch(API_URL+"/numbers",{cache:"no-store"});
        if(!response.ok)throw new Error("No se pudo cargar la lista");
        const data=await response.json();
        numbers=Array.isArray(data.numbers)?data.numbers:[];
        if(!numbers.length)throw new Error("No hay números disponibles");
        document.getElementById("openBtn").addEventListener("click",()=>{location.href=buildWaLink(elegirNumeroRandom())});
        document.getElementById("chooseBtn").addEventListener("click",openManual);
        setTimeout(()=>{if(document.visibilityState==="visible")location.href=buildWaLink(elegirNumeroRandom())},redirectDelay);
      }catch(error){mostrarFalla()}
    }
    iniciar();
  </script>
</body>
</html>
